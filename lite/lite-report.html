<!DOCTYPE html>
<html lang="th">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>BMA-Plan Lite — รายงานพื้นที่</title>
<style>
  :root{ --ink:#1a1f26; --line:#c9d1da; --muted:#6a7480; --lock:#eef1f4; }
  *{box-sizing:border-box}
  body{margin:0;font-family:"Segoe UI","Sarabun","Leelawadee UI",system-ui,sans-serif;background:#3a3f47;color:var(--ink)}

  .toolbar{position:sticky;top:0;z-index:10;display:flex;gap:10px;align-items:center;
    padding:10px 16px;background:#1c1f24;color:#e6e9ee;border-bottom:1px solid #000}
  .toolbar b{font-size:13px}
  .toolbar .hint{font-size:12px;color:#9aa3ad}
  .toolbar .sp{flex:1}
  .src{font-size:11px;color:#67d987;padding:2px 8px;border:1px solid #2f6f3a;border-radius:4px}
  button{background:#2f6df0;color:#fff;border:0;padding:7px 14px;border-radius:6px;cursor:pointer;font-size:13px}

  .sheetwrap{padding:22px;display:flex;flex-direction:column;align-items:center;gap:22px}
  /* S-1 ทาง ก (REVIEW_LITE_LAYER_REPORT_20260704 ledger, slice C/4): grid is the
     ONLY report view now. #re-host is the jspreadsheet-editable table itself;
     .rptHdr is a small project name/date header printed above it (the old
     per-sheet contenteditable header only existed in the removed classic view). */
  .rptHdr{background:#fff;width:297mm;padding:8mm 12mm;box-shadow:0 6px 26px rgba(0,0,0,.45);
    border-radius:4px;display:flex;justify-content:space-between;align-items:flex-end}
  .rptHdr .ttl{font-size:18px;font-weight:700}
  .rptHdr .meta{font-size:11px;color:var(--muted);text-align:right;line-height:1.5}
  #re-host{background:#fff;width:297mm;padding:12mm 12mm 10mm;box-shadow:0 6px 26px rgba(0,0,0,.45);border-radius:4px}
  .rvcard{background:#fff;width:297mm;padding:10mm 12mm;box-shadow:0 6px 26px rgba(0,0,0,.45)}
  .rvcard .rv-hdr{font-size:15px;font-weight:700;border-bottom:2px solid var(--ink);padding-bottom:6px;margin-bottom:10px}
  .rvcard table{width:auto;min-width:220px;border-collapse:collapse;font-size:13px}
  .rvcard td{border:1px solid var(--line);padding:5px 10px;vertical-align:middle}
  .rvcard td.rv-name{font-weight:600;background:#eef2f6}
  .rvcard td.rv-val{text-align:right;font-variant-numeric:tabular-nums;background:var(--lock);white-space:nowrap;min-width:90px}
  .rvcard td.rv-null{text-align:right;color:var(--muted);background:var(--lock);min-width:90px}

  /* S-1e (REVIEW_LITE_LAYER_REPORT_20260704 ledger, slice E/5, user GO):
     plan-image APPENDIX, printed after the grid+vars card. Positioning
     math (planbox/svg viewBox-on-load/centroid badge placement) is reused
     from the classic view deleted in slice C (see `git show fc63e72~1:
     lite/lite-report.html`'s buildSheet) -- scoped under .appx-page so it
     doesn't reintroduce classic's bare global class names. */
  details.appx{width:297mm}
  details.appx summary{cursor:pointer;background:#fff;padding:8px 12mm;border-radius:4px;
    box-shadow:0 6px 26px rgba(0,0,0,.45);font-weight:700;font-size:13px}
  .appx-body{display:flex;flex-direction:column;gap:10mm;margin-top:10mm}
  .appx-page{background:#fff;width:297mm;padding:10mm 12mm;box-shadow:0 6px 26px rgba(0,0,0,.45);border-radius:4px}
  .appx-phdr{font-size:14px;font-weight:700;border-bottom:2px solid var(--ink);padding-bottom:6px;margin-bottom:8px}
  .appx-page .imgbox{width:100%;display:flex;align-items:center;justify-content:center;
    background:#f3f5f7;border:1px solid var(--line);min-height:150mm;position:relative;overflow:hidden}
  .appx-page .planbox{position:relative;max-width:100%;max-height:172mm;line-height:0}
  .appx-page .planbox img{max-width:100%;max-height:172mm;display:block}
  .appx-page .planbox svg{position:absolute;left:0;top:0;width:100%;height:100%;pointer-events:none}
  .appx-page .cap{position:absolute;bottom:6px;left:8px;font-size:10px;color:var(--muted);background:rgba(255,255,255,.7);padding:1px 5px;border-radius:3px}

  @page{ size: A4 landscape; margin: 8mm; }
  @media print{
    body{background:#fff}
    .toolbar{display:none !important}
    .sheetwrap{padding:0;gap:6mm}
    .rptHdr,.rvcard{box-shadow:none}
    #re-host{box-shadow:none}
    /* grid IS the print output now (S-1 ทาง ก) — hide jspreadsheet chrome
       (toolbar/about-branding/select-all corner/row-number column/resize
       corner/context-menu/selection-highlight), CSS-only, no jexcel fork. */
    .re-ops,.re-status{display:none !important}
    .jexcel_toolbar,.jexcel_about,.jexcel_contextmenu,.jexcel_corner,.jexcel_pagination{display:none !important}
    #re-host td.jexcel_selectall,#re-host td.jexcel_row{display:none !important}
    #re-host col:first-child{display:none !important}
    #re-host .highlight,#re-host .highlight-top,#re-host .highlight-left,
    #re-host .highlight-right,#re-host .highlight-bottom,#re-host .highlight-selected{
      background:transparent !important;border-color:transparent !important}
    /* page-break hint at each page-title separator row (report-edit.js tags
       these 're-page-break', skipping the very first row so page 1 doesn't
       start with a blank leading page) — "where feasible" per spec; browser
       print pagination for the rest of the table is otherwise automatic. */
    tr.re-page-break{page-break-before:always}
    /* S-1e (slice E/5): appendix ALWAYS prints in full regardless of the
       on-screen <details> open/closed toggle -- force the body visible,
       hide only the screen-only summary toggle affordance. Each page block
       starts its own printed page. */
    details.appx summary{display:none !important}
    .appx-body{display:block !important;margin-top:0}
    .appx-page{box-shadow:none;page-break-before:always}
    .appx-page .imgbox{background:#fff;border-color:#999}
  }
</style>
<link rel="stylesheet" href="static/js/vendor/jsuites.min.css">
<link rel="stylesheet" href="static/js/vendor/jspreadsheet.min.css">
</head>
<body>

<div class="toolbar">
  <b>📝 รายงานพื้นที่ (แก้ไขได้ก่อนพิมพ์)</b>
  <span class="src" id="srcTag">…</span>
  <span class="hint">คลิกช่อง "ประเภท" เพื่อแก้ชื่อรายการ, กด + แทรกแถว Subtotal เพื่อรวมยอดเอง — ตัวเลขพื้นที่ล็อก (จากการวัด)</span>
  <span class="sp"></span>
  <button id="print">🖨 พิมพ์ / บันทึก PDF</button>
</div>

<div class="sheetwrap" id="re-wrap">
  <div class="rptHdr" id="rpt-hdr"></div>
  <div id="re-host"></div>
</div>

<script>
/* ===========================================================================
   BMA-Plan Lite — report page (LITE-REPORT / INV-2026-05-21-002, approach A).
   S-1 ทาง ก (REVIEW_LITE_LAYER_REPORT_20260704 ledger, slice C/4): grid is the
   ONLY view now — the old contenteditable "classic" per-page sheet view +
   view-toggle button were removed; what's shown/edited in the grid is what
   prints (Ctrl+P / the print button), on A4 landscape.
   Payload from sessionStorage["bmaReportPayload"] (same-origin window.open copy),
   else a bundled SAMPLE so the page is standalone. Area numbers READ-ONLY.
   =========================================================================== */

function esc(s){ return String(s==null?"":s).replace(/[&<>"]/g,function(c){
  return {"&":"&amp;","<":"&lt;",">":"&gt;","\"":"&quot;"}[c]; }); }
function fmt(n){ return Number(n).toLocaleString("th-TH",{minimumFractionDigits:2,maximumFractionDigits:2}); }

/* --- standalone sample (no live data). S-1e (slice E/5, user GO): plan-image
   fields (imgUrl/overlays) are back, feeding the appendix restored below --
   sampleSVG draws a placeholder plan so the standalone demo has something
   to show in the appendix too. */
function sampleSVG(label){
  var svg="<svg xmlns='http://www.w3.org/2000/svg' width='800' height='600'>"+
   "<rect width='800' height='600' fill='#fafbfc'/>"+
   "<rect x='90' y='90' width='420' height='300' fill='#3b82f622' stroke='#3b82f6' stroke-width='3'/>"+
   "<rect x='540' y='110' width='180' height='150' fill='#39d98a22' stroke='#39d98a' stroke-width='3'/>"+
   "<rect x='300' y='320' width='90' height='90' fill='#ff6b6b22' stroke='#ff6b6b' stroke-width='3'/>"+
   "<text x='20' y='585' fill='#9aa3ad' font-size='15'>"+label+" (ตัวอย่าง — ปกติคือภาพ render หน้า PDF)</text></svg>";
  return "data:image/svg+xml;utf8,"+encodeURIComponent(svg);
}
var SAMPLE={ project:"โครงการบ้านพักอาศัย 2 ชั้น (ตัวอย่าง)", date:new Date().toLocaleDateString("th-TH"),
  pages:[{ idx:1, title:"ชั้น 1 — ผังพื้น", imgUrl:sampleSVG("ชั้น 1"),
    overlays:[ {pts:[{x:90,y:90},{x:510,y:90},{x:510,y:390},{x:90,y:390}],color:"#3b82f6",badge:1},
               {pts:[{x:540,y:110},{x:720,y:110},{x:720,y:260},{x:540,y:260}],color:"#39d98a",badge:2},
               {pts:[{x:300,y:320},{x:390,y:320},{x:390,y:410},{x:300,y:410}],color:"#ff6b6b",badge:3} ],
    groups:[ {label:"พื้นที่อาคาร",rows:[{name:"ห้องโถง",area:58.40}],subtotal:58.40,sign:1},
             {label:"พื้นที่ใช้สอย",rows:[{name:"ห้องนอน",area:16.20}],subtotal:16.20,sign:1},
             {label:"ช่องว่าง/หัก",rows:[{name:"ช่องบันได",area:6.10}],subtotal:6.10,sign:-1} ],
    net:68.50 }],
  _sample:true };

function loadPayload(){
  try{ var raw=sessionStorage.getItem("bmaReportPayload");
    if(raw){ var p=JSON.parse(raw); if(p&&Array.isArray(p.pages)){ document.getElementById("srcTag").textContent="ข้อมูลจริงจากการวัด"; return p; } }
  }catch(e){}
  document.getElementById("srcTag").textContent="ตัวอย่าง (standalone)";
  return SAMPLE;
}

/* project name/date header, printed above the grid (S-1 ทาง ก: the old
   per-sheet contenteditable header only existed in the removed classic
   view -- this is its replacement, read-only, one per report). */
function buildHdr(payload){
  var hdr=document.getElementById("rpt-hdr"); if(!hdr) return;
  var n=(payload.pages&&payload.pages.length)||0;
  hdr.innerHTML='<div class="ttl">'+esc(payload.project||"(ยังไม่ตั้งชื่อโครงการ)")+'</div>'+
    '<div class="meta">'+(n?n+' หน้าที่มีพื้นที่วัด • ':'')+esc(payload.date||"")+'</div>';
}

function buildVarsCard(vars){
  if(!vars||!vars.length) return null;
  var card=document.createElement("div"); card.className="rvcard";
  var hdr=document.createElement("div"); hdr.className="rv-hdr";
  hdr.textContent="ค่าที่คำนวณ / ตัวชี้วัดโครงการ";
  card.appendChild(hdr);
  var tbl=document.createElement("table");
  vars.forEach(function(v){
    var tr=document.createElement("tr");
    var tdN=document.createElement("td"); tdN.className="rv-name"; tdN.textContent=esc(v.name); tr.appendChild(tdN);
    var tdV=document.createElement("td");
    if(v.err||v.value==null){
      tdV.className="rv-null"; tdV.textContent="—";
    } else {
      tdV.className="rv-val";
      var disp=Number(v.value);
      disp=(Math.abs(disp)>=100)?disp.toFixed(0):disp.toFixed(2);
      tdV.textContent=disp+(v.unit?" "+v.unit:"");
    }
    tr.appendChild(tdV); tbl.appendChild(tr);
  });
  card.appendChild(tbl);
  return card;
}

/* S-1e (REVIEW_LITE_LAYER_REPORT_20260704 ledger, slice E/5, user GO): plan-
   image appendix, printed after the grid+vars card. Positioning math
   (planbox sizing, SVG viewBox set from img.naturalWidth/Height on load,
   centroid-based badge placement) is reused verbatim from the classic view
   deleted in slice C -- see `git show fc63e72~1:lite/lite-report.html`'s
   buildSheet()/centroid(). overlays[].pts are already RS-multiplied render-
   scale coords from export-annotate.js (buildReportPayload) — same
   viewBox convention classic consumed, NOT rescaled here. */
function centroid(pts){ var x=0,y=0; pts.forEach(function(p){x+=p.x;y+=p.y;}); return {x:x/pts.length,y:y/pts.length}; }

function buildAppendixPage(page){
  var wrap=document.createElement("div"); wrap.className="appx-page";
  var hdr=document.createElement("div"); hdr.className="appx-phdr";
  hdr.textContent="หน้า "+page.idx+(page.title?(" — "+page.title):"");

  var imgbox=document.createElement("div"); imgbox.className="imgbox";
  var box=document.createElement("div"); box.className="planbox";
  var img=document.createElement("img"); img.alt="plan"; img.loading="lazy"; img.src=page.imgUrl||"";
  var svgNS="http://www.w3.org/2000/svg";
  var svg=document.createElementNS(svgNS,"svg"); svg.setAttribute("preserveAspectRatio","none");
  (page.overlays||[]).forEach(function(ov){
    if(!ov.pts||!ov.pts.length) return;
    var poly=document.createElementNS(svgNS,"polygon");
    poly.setAttribute("points",ov.pts.map(function(p){return p.x+","+p.y;}).join(" "));
    poly.setAttribute("fill",ov.color); poly.setAttribute("fill-opacity","0.16");
    poly.setAttribute("stroke",ov.color); poly.setAttribute("stroke-width","3"); svg.appendChild(poly);
    var c=centroid(ov.pts);
    var circ=document.createElementNS(svgNS,"circle");
    circ.setAttribute("cx",c.x); circ.setAttribute("cy",c.y); circ.setAttribute("r","16"); circ.setAttribute("fill",ov.color); svg.appendChild(circ);
    var t=document.createElementNS(svgNS,"text"); t.setAttribute("x",c.x); t.setAttribute("y",c.y+6);
    t.setAttribute("text-anchor","middle"); t.setAttribute("font-size","20"); t.setAttribute("fill","#fff"); t.setAttribute("font-weight","700");
    t.textContent=ov.badge; svg.appendChild(t);
  });
  img.addEventListener("load",function(){
    var w=img.naturalWidth||800, h=img.naturalHeight||600;
    svg.setAttribute("viewBox","0 0 "+w+" "+h);
  });
  img.addEventListener("error",function(){ box.insertAdjacentHTML("beforeend",'<div class="cap">โหลดภาพหน้าไม่ได้ (เซิร์ฟเวอร์ lite ปิด?)</div>'); });
  box.appendChild(img); box.appendChild(svg);
  imgbox.appendChild(box);
  imgbox.insertAdjacentHTML("beforeend",'<div class="cap">แปลน + พื้นที่ที่วัด</div>');

  wrap.appendChild(hdr); wrap.appendChild(imgbox);
  return wrap;
}

function buildAppendix(payload){
  var pages=payload.pages||[];
  if(!pages.length) return null;
  var det=document.createElement("details"); det.className="appx"; det.open=true;
  var sum=document.createElement("summary");
  sum.textContent="ภาคผนวก: แปลนที่วัด ("+pages.length+" หน้า) — คลิกเพื่อย่อ/ขยาย";
  det.appendChild(sum);
  var body=document.createElement("div"); body.className="appx-body";
  pages.forEach(function(p){ body.appendChild(buildAppendixPage(p)); });
  det.appendChild(body);
  return det;
}

document.getElementById("print").onclick=function(){ window.print(); };
/* expose SAMPLE payload reference for grid seed fallback (used below) */
window.__SAMPLE_PAYLOAD=SAMPLE;
</script>
<script src="static/js/vendor/jsuites.min.js"></script>
<script src="static/js/vendor/jspreadsheet.min.js"></script>
<script src="static/js/report-edit.js"></script>
<script>
/* ---------- S-1 ทาง ก (REVIEW_LITE_LAYER_REPORT_20260704 ledger, slice C/4) ----------
   Grid is the ONLY report view -- mounted unconditionally on load, no toggle,
   no classic DOM. What's shown/edited here is what prints. */
(function(){
  var host=document.getElementById("re-host");

  function gridRows(payload){
    /* B-2/B-3 (slice B/4): flatten EVERY payload page's group rows (not just
       pages[0]) into [{page,name,area,sign}]. sign comes straight from the
       group's own sign (role-derived upstream in buildReportPayload — see
       export-annotate.js:78) so report-edit.js can default deduction rows
       to SUBTRACT instead of silently adding them (closes B-3).
       Grouping choice: a text-only page-title separator ROW before each
       page's first group, rather than a 3rd jspreadsheet column — this
       keeps report-edit.js's "area rows are one contiguous leading block"
       invariant intact (no column-index rewiring / formula-reference risk)
       while still reading as page-grouped. Only inserted when there is
       more than 1 page, so a single-page payload's grid is unchanged.
       sep:true additionally tags the row for report-edit.js's print
       page-break styling (slice C). */
    var rows=[];
    if(payload&&payload.pages&&payload.pages.length){
      var multi=payload.pages.length>1;
      payload.pages.forEach(function(p){
        if(multi){
          rows.push({name:"— หน้า "+p.idx+(p.title?(" · "+p.title):"")+" —",area:"",sign:1,page:p.idx,sep:true});
        }
        (p.groups||[]).forEach(function(g){
          (g.rows||[]).forEach(function(r){ rows.push({name:r.name,area:r.area,sign:(g.sign<0?-1:1),page:p.idx}); });
        });
      });
    }
    return rows;
  }

  var payload=loadPayload();
  buildHdr(payload);
  var rows=gridRows(payload);
  ReportEdit.mount(host, rows.length?rows:null);
  var vc=buildVarsCard(payload.reportVars);
  if(vc) document.getElementById("re-wrap").appendChild(vc);
  var ap=buildAppendix(payload);   // S-1e (slice E/5): plan-image appendix, after grid+vars
  if(ap) document.getElementById("re-wrap").appendChild(ap);
  document.title="รายงานพื้นที่ — "+(payload.project||"BMA-Plan Lite");
})();
</script>
</body>
</html>
